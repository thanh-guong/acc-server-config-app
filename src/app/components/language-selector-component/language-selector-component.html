<button mat-button [matMenuTriggerFor]="languageMenu">
  <mat-icon>language</mat-icon> {{ currentLanguage.toUpperCase() }}
</button>

<mat-menu #languageMenu="matMenu">
  <button mat-menu-item *ngFor="let opt of options" (click)="onLanguageChange(opt.value)">
    {{ opt.label }}
  </button>
</mat-menu>
